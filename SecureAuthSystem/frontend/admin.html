<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="dashboard-header">
        <h1>Admin Control Panel</h1>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="admin-container">
        <h2>Pending Device Approvals</h2>
        <div id="requestsList" class="requests-grid">
            Loading...
        </div>
    </div>

    <!--
        Comments:
        - Admin panel loads dynamically by reading all requests that are 'pending' from SQL.
        - Provides manual Approve or Reject buttons passing request and device IDs.
    -->
    <script>
        // Check local token first
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        async function fetchRequests() {
            try {
                const res = await fetch('/api/admin/requests', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401 || res.status === 403) {
                    alert('Unauthorized. Only Admins allowed.');
                    logout();
                    return;
                }

                const requests = await res.json();
                const container = document.getElementById('requestsList');

                // Fill UI natively without frameworks
                if (requests.length === 0) {
                    container.innerHTML = '<p>No pending login requests.</p>';
                    return;
                }

                container.innerHTML = '';
                requests.forEach(req => {
                    // Create card for each pending request with user, ip, browser context
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `
                        <p><strong>User:</strong> ${req.name} (${req.email})</p>
                        <p><strong>IP Address:</strong> ${req.ip_address}</p>
                        <p><strong>Browser Info:</strong> ${req.browser || 'Unknown'}</p>
                        <p><strong>Attempted At:</strong> ${new Date(req.login_time).toLocaleString()}</p>
                        <div class="actions">
                            <button class="approve-btn" onclick="handleAction('approve', ${req.request_id}, ${req.device_id})">Approve</button>
                            <button class="reject-btn" onclick="handleAction('reject', ${req.request_id}, null)">Reject</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('requestsList').innerText = 'Failed to load data.';
            }
        }

        // Make API calls for Approve/Reject requests
        async function handleAction(action, requestId, deviceId) {
            try {
                const body = action === 'approve'
                    ? { request_id: requestId, device_id: deviceId }
                    : { request_id: requestId };

                const res = await fetch(`/api/admin/${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    alert(`Request ${action}d successfully`);
                    fetchRequests(); // Reload list to remove approved/rejected user
                } else {
                    alert(`Error attempting to ${action}`);
                }
            } catch (e) {
                alert(`Error executing action`);
            }
        }

        // Kill token when leaving via logout
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        // Kickoff page initialization automatically
        fetchRequests();
    </script>
</body>

</html>
