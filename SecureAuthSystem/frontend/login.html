<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Secure System</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h2>System Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
            <div id="msg" class="alert hidden"></div>
        </form>
        <p>No account? <a href="register.html">Register here</a></p>
    </div>

    <!--
        Comments:
        - When login fails due to a new device, the backend returns a 403 status 
        and specifically tells us the approval is pending.
        - We display this to the user in a yellow warning box.
    -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('msg');

            // Clear message box on new attempt
            msgBox.className = 'alert hidden';

            try {
                // Send Login request
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) { // Status 200 checks out
                    localStorage.setItem('token', data.token); // Save jwt token for sessions

                    // Route admins vs normal users correctly
                    if (data.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else if (res.status === 403) {
                    // This is the trigger for unapproved new device (403 forbidden usually)
                    msgBox.className = 'alert warning';
                    msgBox.innerHTML = `⚠️ <b>Login pending admin approval</b><br><small>We detected a login attempt from a new device/browser. Please wait for an admin to approve your device explicitly.</small>`;
                } else {
                    // Regular generic error (invalid credentials)
                    msgBox.className = 'alert error';
                    msgBox.innerText = data.message;
                }
            } catch (err) {
                // Request completely failed to reach node server
                msgBox.className = 'alert error';
                msgBox.innerText = 'Network error connecting to the server.';
            }
        });
    </script>
</body>

</html>
