<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Secure System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Register New Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Register</button>
            <p id="msg"></p>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <!-- 
        Comments:
        - We intercept form submission to call our Node API properly.
        - Using fetch allows us to handle background requests cleanly without reloading the page.
    -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Submit the form details to the node backend
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('msg').style.color = 'green';
                    document.getElementById('msg').innerText = 'Registration successful! Redirecting...';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    document.getElementById('msg').style.color = 'red';
                    document.getElementById('msg').innerText = data.message;
                }
            } catch (err) {
                document.getElementById('msg').innerText = 'Error connecting to server';
            }
        });
    </script>
</body>
</html>
